name: keep-supabase-awake

# 무료 Supabase는 1주일 미사용 시 자동 정지됩니다.
# 매일 한 번 깨워서(REST/AUTH 요청) 정지되지 않게 합니다.
on:
  schedule:
    - cron: '17 2 * * *'   # 매일 02:17 UTC = 한국시간 11:17
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 깨우기 (정지 방지)
        run: |
          U="https://vunfakhmugojcbnbobtm.supabase.co"
          K="sb_publishable_4L7dtw9wbagYgFqEAXgfEQ_LqRDg0UT"
          echo "REST:"; curl -s -o /dev/null -w "%{http_code}\n" "$U/rest/v1/user_data?select=user_id&limit=1" -H "apikey: $K"
          echo "AUTH:"; curl -s -o /dev/null -w "%{http_code}\n" "$U/auth/v1/health" -H "apikey: $K"

      - name: 저장소 활동 유지 (월 1회 커밋 — 스케줄 자동 비활성 방지)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > keepalive-last.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive-last.txt
            git commit -m "keepalive $(date -u +%Y-%m-%d)" || echo "nothing to commit"
            git push || echo "push skipped"
          else
            echo "오늘은 1일이 아니므로 커밋 생략"
          fi
